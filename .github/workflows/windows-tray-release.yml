name: Windows tray release

on:
  push:
    tags: ['tray-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tray-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build Windows application
        run: ./scripts/build_tray.ps1 -InstallDeps
      - name: Test web and tray behavior
        run: |
          $suites = @('test_workbench_tray.py', 'test_web_workbench.py', 'test_provider_auth.py', 'test_workflow_service.py', 'test_run_history.py', 'test_plan_workflow.py')
          foreach ($suite in $suites) {
            & ./.venv-tray/Scripts/python.exe -m unittest discover -s tests -p $suite
            if ($LASTEXITCODE -ne 0) { throw "Failed: $suite" }
          }
          foreach ($suite in @('test_live_adapter.cjs', 'test_role_deliverables.cjs', 'test_document_preview.cjs', 'test_markdown_plan_preset.cjs')) {
            & node "tests/$suite"
            if ($LASTEXITCODE -ne 0) { throw "Failed: $suite" }
          }
      - name: Verify executable and package ZIP
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "manual-$env:GITHUB_RUN_NUMBER" }
          ./scripts/package_tray.ps1 -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: WorkbenchTray-windows-x64
          path: |
            dist/releases/*.zip
            dist/releases/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Create draft GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tray-v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist/releases -File | Where-Object { $_.Extension -in '.zip', '.sha256' } | ForEach-Object FullName)
          & gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --title "Workbench Tray $env:GITHUB_REF_NAME" --notes-file .github/tray-release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release. Existing releases are never overwritten; download the build artifact to recover.' }
